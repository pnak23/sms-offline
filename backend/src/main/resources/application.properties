# --- Local-only server. The real port is chosen by the OS (0) and reported to Electron on stdout. -------------
server.address=127.0.0.1
server.port=0
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=1
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Footprint (docs §4C.3): no JMX, no banner, no open-in-view, schema owned by Flyway ----------------------
spring.main.banner-mode=off
spring.jmx.enabled=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# --- SQLite (docs §5.1; proven by spike S2) ------------------------------------------------------------------
# Application connections: FK enforcement, WAL, busy timeout, IMMEDIATE transactions (deferred mode failed 72-78/100).
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${sms.data-dir}/database/school.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL&transaction_mode=IMMEDIATE
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
# Flyway uses its OWN connection with foreign_keys OFF so table rebuilds work (docs §5.4).
spring.flyway.url=jdbc:sqlite:${sms.data-dir}/database/school.db?journal_mode=WAL&busy_timeout=5000
spring.flyway.locations=classpath:db/migration

# --- Logging: file under the data dir, rotated; never log personal data, passwords or keys -------------------
logging.file.name=${sms.data-dir}/logs/backend.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=40MB
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=WARN
logging.level.org.apache=WARN
# expected business violations are mapped by our own translator; keep Hibernate from logging them as errors
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF

# --- Application ---------------------------------------------------------------------------------------------
sms.cors.allowed-origins=app://school,http://localhost:3000,http://127.0.0.1:3000
sms.session.idle-minutes=30
sms.session.absolute-hours=12
