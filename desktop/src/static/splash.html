<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src 'self'">
<title>{{SHORT_NAME}}</title>
<style>
  @font-face { font-family: "Noto Sans Khmer"; font-weight: 400; src: url("fonts/noto-sans-khmer-400.woff2") format("woff2"); }
  @font-face { font-family: "Noto Sans Khmer"; font-weight: 700; src: url("fonts/noto-sans-khmer-700.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; background: #fff; font-family: "Noto Sans Khmer", "Leelawadee UI", "Segoe UI", sans-serif; color: #1f2d3d; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 1px solid #d5dbe3; box-sizing: border-box; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; line-height: 1.7; }
  p { font-size: 16px; margin: 0; color: #5b6b7c; line-height: 1.7; }
  .spinner { width: 34px; height: 34px; border: 4px solid #dbe4ef; border-top-color: #2f6fb3; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
</style>
</head>
<body>
  <div class="spinner" role="progressbar" aria-label="loading"></div>
  <h1>កំពុងបើកកម្មវិធី…</h1>
  <p>សូមរង់ចាំបន្តិច</p>
</body>
</html>
